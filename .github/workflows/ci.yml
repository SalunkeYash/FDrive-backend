name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fdrive
          POSTGRES_PASSWORD: fdrive
          POSTGRES_DB: fdrive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fdrive -d fdrive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fdrive:fdrive@localhost:5432/fdrive
      JWT_SECRET: ci-test-jwt-secret-not-for-prod
      SQS_QUEUE_URL: ""
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Migrate
        run: alembic upgrade head
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
